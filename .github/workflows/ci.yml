# ROLE: CI для проекта. uv/pytest/ruff для backend, npm/tsc/vite/vitest для frontend.
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, dev, 'remediation/**']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (uv + ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.2"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          working-directory: backend
      - name: Verify lockfile is current
        run: uv lock --check
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Verify generated protobuf code
        run: |
          uv run --frozen python scripts/generate_proto.py
          git diff --exit-code -- app/engine/systems/snake_pb2.py
      - name: Run pytest
        run: uv run --frozen pytest tests/ -q
      - name: Audit runtime dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > /tmp/backend-requirements.txt
          uvx pip-audit==2.10.1 -r /tmp/backend-requirements.txt

  frontend:
    name: Frontend (lint + typecheck + build + vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck & build
        run: npm run build
      - name: Run vitest
        run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.2"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E smoke tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: "true"
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Validate compose configuration
        run: docker compose config --quiet
        env:
          ADMIN_PASSWORD: ci-only
      - name: Build backend image
        run: docker build -t polzuchie-backend:ci backend
      - name: Build frontend image
        run: docker build -t polzuchie-frontend:ci frontend
