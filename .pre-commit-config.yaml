# ROLE: Git hooks. Fast affected-stack tests on commit, full tests+build on push.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]
minimum_pre_commit_version: "4.0.0"
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-case-conflict
      - id: check-json
        # tsconfig files use JSONC (comments), so the JSON hook must skip them.
        exclude: ^frontend/tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: end-of-file-fixer
        exclude: >-
          (?x)^(
            frontend/src/worker/shared/snake_proto\.(js|d\.ts)|
            backend/app/engine/systems/snake_pb2\.py|
            .*\.bin
          )$
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
        exclude: >-
          (?x)^(
            frontend/src/worker/shared/snake_proto\.(js|d\.ts)|
            backend/app/engine/systems/snake_pb2\.py|
            .*\.bin
          )$
      - id: detect-private-key

  - repo: local
    hooks:
      - id: backend-tests
        name: backend tests (pytest)
        entry: python scripts/run_checks.py backend-tests
        language: system
        files: ^(backend/.*\.py|backend/pytest\.ini|tests_shared/.*)$
        pass_filenames: false

      - id: frontend-tests
        name: frontend tests (vitest)
        entry: python scripts/run_checks.py frontend-tests
        language: system
        files: ^(frontend/src/.*\.(ts|tsx)|frontend/(package\.json|package-lock\.json|vite\.config\.ts|tsconfig.*\.json)|tests_shared/.*)$
        pass_filenames: false

      - id: backend-tests-push
        name: backend tests (pre-push)
        entry: python scripts/run_checks.py backend-tests
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: frontend-tests-push
        name: frontend tests (pre-push)
        entry: python scripts/run_checks.py frontend-tests
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

      - id: frontend-build-push
        name: frontend typecheck & build (pre-push)
        entry: python scripts/run_checks.py frontend-build
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
