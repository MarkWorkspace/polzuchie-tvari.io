[project]
name = "polzuchie-tvari-backend"
version = "0.1.0"
description = "FastAPI + WebSocket authoritative simulation for Polzuchie-tvari.io"
requires-python = ">=3.13"
dependencies = [
    "websockets==17.3",
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "protobuf==7.36.2",
    "pydantic==2.14.1",
]

[dependency-groups]
dev = [
    "grpcio-tools==1.85.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "pre-commit==4.7.0",
    "ruff==0.17.2",
    "httpx2==2.16.0",
]

[tool.uv]
# This is an application, not an installable library: sync deps only.
package = false
required-version = ">=0.11.2"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["app/engine/systems/snake_pb2.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# server.py inserts its own directory into sys.path before app imports.
"server.py" = ["E402"]
